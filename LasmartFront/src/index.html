<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="src/index.css"/>
    <link href="https://kendo.cdn.telerik.com/themes/10.2.0/default/default-main.css" rel="stylesheet" />
</head>
<body>
   
    <div class="main_container">
        <header>
            <button id="btn1">add circled</button>
        </header>
        <div class="popup">
            <button id="btn2">x</button>
            <h3>add circle</h3>
            <form class="circle">
                <input type="number" placeholder="x" name="x" />
                <input type="number" placeholder="y" name="y" />
                <input type="number" placeholder="radius"name="radius" />
                <label>
                    <input type="color" placeholder="color"name="color" />   
                color</label>
                <input type="submit" class="submit1"/>
            </form>
        </div>
        <div class="popup_comment">
            <button id="btn3">x</button>
            <h3>add commit</h3>
            <form class="comment">
                <input type="text" placeholder="enter comment" name="text" value=""/>
                <label>
                    <input type="color" placeholder="color"name="background" />   
                color</label>
                <input type="submit" class="submit2"/>
            </form>
        </div>
        </div><div id='container'>
    </div>  
    <script src="https://code.jquery.com/jquery-1.12.3.min.js"></script>
    <script src="https://kendo.cdn.telerik.com/2025.1.227/js/kendo.all.min.js"></script>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <script  type="module" src="src/index.js"></script>
</body>
</html>
